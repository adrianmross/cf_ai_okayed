# Declarations only, no values. Each machine keeps them in whatever provider it already uses (keyring, Proton Pass,
# 1Password, ...); `secretspec check` asks for anything missing. CI and the deployed Worker use secrets of the same name.
[project]
name = "okayed"
revision = "1.0"

[profiles.default]
ISSUER_SECRET = { description = "Signs grants: 32 random bytes as hex (openssl rand -hex 32)", required = true }
GITHUB_TOKEN = { description = "Fine-grained token with pull-request write on the demo repo only", required = false }
CLOUDFLARE_API_TOKEN = { description = "For wrangler deploy without wrangler login", required = false }
CLOUDFLARE_ACCOUNT_ID = { description = "The account wrangler deploys to", required = false }
TURNSTILE_SECRET = { description = "Turnstile secret key, to check sign-ups", required = false }
CF_API_TOKEN = { description = "Real deploys: a token allowed only Account API Tokens: Edit, to mint per-deploy tokens", required = false }
GITHUB_APP_KEY = { description = "GitHub App private key (PEM), instead of GITHUB_TOKEN", required = false }
SLACK_BOT_TOKEN = { description = "Slack bot token, for the slack capability pack", required = false }
SCIM_TOKEN = { description = "Bearer token your IdP uses for SCIM provisioning", required = false }
DRAFT_API_KEY = { description = "API key for an OpenAI-compatible drafter (DRAFTER=openai-compatible)", required = false }

# Same as default, for setups whose secretspec profile is "development".
[profiles.development]
